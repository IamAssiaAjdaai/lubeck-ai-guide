services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: citywalk
      POSTGRES_USER: citywalk
      POSTGRES_PASSWORD: citywalk
    ports:
      - "5432:5432"
    volumes:
      - citywalk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citywalk -d citywalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: citywalk-local
      MINIO_ROOT_PASSWORD: citywalk-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - citywalk_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 citywalk-local citywalk-local-secret &&
        mc mb --ignore-existing local/citywalk-local
    restart: "no"

volumes:
  citywalk_postgres_data:
  citywalk_minio_data:
