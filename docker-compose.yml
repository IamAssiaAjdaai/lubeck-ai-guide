services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: citywalk
      POSTGRES_USER: citywalk
      POSTGRES_PASSWORD: citywalk
    ports:
      - "5432:5432"
    volumes:
      - citywalk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citywalk -d citywalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:2026.08.3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - citywalk_localstack_data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:4566/_localstack/health >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  citywalk_postgres_data:
  citywalk_localstack_data:
