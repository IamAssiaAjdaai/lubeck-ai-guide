name: Regenerate Cloudflare lockfile

on:
  push:
    branches: [chore/cloudflare-vinext-latest]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/regenerate-cloudflare-lock.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/cloudflare-vinext-latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from current package graph
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: regenerate Cloudflare lockfile"
          git push origin HEAD:chore/cloudflare-vinext-latest
