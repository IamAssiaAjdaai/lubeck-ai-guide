name: Validate Cloudflare vinext build

on:
  pull_request:
    branches: [develop]
    paths:
      - "package.json"
      - "package-lock.json"
      - "vite.config.mts"
      - "cloudflare.config.ts"
      - "tsconfig.json"
      - ".github/workflows/cloudflare-vinext-validate.yml"

permissions:
  contents: read

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker target
        run: npm run build:vinext

      - name: Validate production deploy without upload
        run: npm run deploy:vinext:dry-run
