name: Generate admin auth migration

on:
  push:
    branches:
      - feat/admin-passkey-v1
    paths:
      - .github/workflows/admin-auth-schema-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-passkey-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet -- drizzle; then
            echo "No migration changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "Generate admin passkey and TOTP migration"
          git push origin HEAD:feat/admin-passkey-v1
