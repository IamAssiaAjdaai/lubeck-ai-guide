name: Generate CMS marketing migration

on:
  push:
    branches:
      - feat/cms-marketing-v1
    paths:
      - .github/workflows/cms-marketing-schema-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketing branch
        uses: actions/checkout@v4
        with:
          ref: feat/cms-marketing-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet -- drizzle; then
            echo "No migration changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "Generate Marketing Control Center migration"
          git push origin HEAD:feat/cms-marketing-v1
