name: Validate landing preview

on:
  pull_request:
    branches: [develop]
    paths:
      - "src/app/landing-preview/**"
      - "src/components/landing/**"
      - "scripts/check-landing-preview.mjs"
      - ".github/workflows/landing-preview-validate.yml"

permissions:
  contents: read

jobs:
  landing-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CITYWALK_CONTENT_SOURCE: code
      DATABASE_URL: postgresql://citywalk:citywalk@127.0.0.1:5432/citywalk_build
      BETTER_AUTH_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set disposable build-only secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build Next.js preview
        run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/citywalk-ui" --no-audit --no-fund --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/citywalk-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check responsive preview on loopback only
        shell: bash
        run: |
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/citywalk-next.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/landing-preview > /dev/null; then break; fi
            sleep 1
          done
          CITYWALK_PLAYWRIGHT_MODULE="$RUNNER_TEMP/citywalk-ui/node_modules/playwright" node scripts/check-landing-preview.mjs
      - name: Upload design-review screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: citywalk-landing-preview
          path: artifacts/landing-preview/
          if-no-files-found: error
          retention-days: 3
      - name: Validate Cloudflare bundle without deployment
        run: |
          npm run build:vinext
          test -f .cloudflare/output/v0/workers/default/bundle/ssr/index.js
          npm run deploy:vinext:dry-run
