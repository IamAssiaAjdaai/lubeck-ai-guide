name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Change detection reads PR file lists; no write access and no production secrets.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs for the same PR/branch before expensive test jobs start.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        # Pinned v3.0.3 action; PR changes are read using a read-only token.
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            web:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'packages/**'
              - 'public/**'
              - 'scripts/**'
              - 'drizzle/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - 'drizzle.config.ts'
              - 'vite.config.mts'
              - 'cloudflare.config.ts'
            mobile:
              - '.github/workflows/ci.yml'
              - 'mobile/**'
              - 'packages/i18n/**'
              - 'packages/traveler-core/**'
            database:
              - '.github/workflows/ci.yml'
              - 'src/db/**'
              - 'src/lib/**'
              - 'src/app/api/**'
              - 'src/data/**'
              - 'drizzle/**'
              - 'packages/traveler-core/**'
              - 'packages/marketing-core/**'
              - 'scripts/run-*-integration-tests.ts'
              - 'scripts/*database*'
              - 'scripts/*migration*'
              - 'scripts/seed-database.ts'
              - 'scripts/verify-database.ts'
              - 'scripts/import-*-cms.ts'
              - 'drizzle.config.ts'
              - 'package.json'
              - 'package-lock.json'

  mobile:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Check launch-language completeness
        run: npm run i18n:check

      - name: Run mobile tests
        run: npm run test:run

      - name: Run mobile lint
        run: npm run lint

      - name: Run mobile TypeScript
        run: npm run typecheck

      - name: Validate Expo configuration
        run: npm run config:validate

      - name: Run Expo Doctor
        run: npm run doctor

  build:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    env:
      # No reachable database; auth initialization does not connect during build.
      DATABASE_URL: postgresql://citywalk:citywalk@127.0.0.1:5432/citywalk_build
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ephemeral build auth secret
        shell: bash
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check launch-language completeness
        run: npm run i18n:check

      - name: Run lint
        run: npm run lint

      - name: Check standalone Marketing Core types
        run: npm run typecheck --workspace @marketing/core
      
      # Vitest coverage executes the entire test suite; don't run tests twice.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build project
        run: npm run build

  database-integration:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: citywalk
          POSTGRES_USER: citywalk
          POSTGRES_PASSWORD: citywalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citywalk -d citywalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://citywalk:citywalk@localhost:5432/citywalk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Marketing generation migration upgrade
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE citywalk_marketing_migration_test'
          DATABASE_URL=postgresql://citywalk:citywalk@localhost:5432/citywalk_marketing_migration_test MARKETING_MIGRATION_INTEGRATION=1 npm run test:run -- src/db/marketingGenerationMigration.integration.test.ts

      - name: Verify Brand Context migration upgrade
        run: BRAND_CONTEXT_MIGRATION_INTEGRATION=1 npm run test:run -- src/db/brandContextMigration.integration.test.ts

      - name: Apply database migration
        run: npm run db:migrate

      - name: Verify PostgreSQL rate limits
        run: npm run rate-limit:test:integration

      - name: Run account lifecycle integration tests
        run: npm run lifecycle:test:integration

      - name: Seed database
        run: npm run db:seed

      - name: Verify database
        run: npm run db:verify

      - name: Re-seed database
        run: npm run db:seed

      - name: Verify seed idempotency
        run: npm run db:verify

      - name: Import canonical CMS content
        run: npm run cms:import-lubeck

      - name: Verify CMS import idempotency
        run: npm run cms:import-lubeck

      - name: Run Brand Context persistence integration tests
        run: npm run brand-context:test:integration

      - name: Run CMS content integration tests
        run: npm run cms:test:integration

      - name: Run generic city content integration tests
        run: npm run content:test:integration

      - name: Run CMS media integration tests
        run: npm run media:test:integration

      - name: Run commerce webhook integration tests
        run: npm run commerce:test:integration
