name: Validate Brand System V1

on:
  push:
    branches:
      - feat/brand-system-v1

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://citywalk:citywalk@127.0.0.1:5432/citywalk_build
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm run test:run
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: git diff --check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run typecheck
      - run: EXPO_PUBLIC_CITYWALK_ENV=production EXPO_PUBLIC_CITYWALK_API_ORIGIN=https://getcitywalk.com npm run config:validate

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vinext
      - run: test -f .cloudflare/output/v0/workers/default/bundle/ssr/index.js
      - run: npm run deploy:vinext:dry-run
