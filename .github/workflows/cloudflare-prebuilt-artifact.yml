name: Build Cloudflare prebuilt artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker target
        run: npm run build:vinext

      - name: Verify vinext SSR module
        run: npm run check:cloudflare-build

      - name: Check isolated Cloudflare types
        run: npm run typecheck:cloudflare

      - name: Validate deploy path without upload
        run: npm run deploy:vinext:dry-run

      - name: Package prebuilt Cloudflare output
        run: tar -czf citywalk-cloudflare-prebuilt.tgz .cloudflare/output

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: citywalk-cloudflare-prebuilt
          path: citywalk-cloudflare-prebuilt.tgz
          retention-days: 3
