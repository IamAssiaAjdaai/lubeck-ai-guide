name: MON-02 lockfile

on:
  pull_request:
    paths:
      - "mobile/package.json"
      - ".github/workflows/mon-02-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh mobile lockfile only
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "chore: refresh mobile package lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
