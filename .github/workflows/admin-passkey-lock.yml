name: Generate admin passkey lockfile

on:
  push:
    branches:
      - feat/admin-passkey-v1
    paths:
      - .github/workflows/admin-passkey-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-passkey-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add Better Auth passkey dependency
        run: npm install @better-auth/passkey@1.7.7 --save-exact --package-lock-only --ignore-scripts

      - name: Commit generated package metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Better Auth passkey dependency"
          git push origin HEAD:feat/admin-passkey-v1
