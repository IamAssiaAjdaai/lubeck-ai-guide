name: Independent Marketing SaaS
on:
  pull_request:
    paths:
      - 'apps/marketing-saas*/**'
      - 'src/lib/marketing/websiteIntake/**'
      - 'packages/marketing-core/**'
      - 'scripts/marketing-saas-*.mjs'
      - 'package*.json'
      - '.github/workflows/marketing-saas.yml'
permissions:
  contents: read
jobs:
  local-saas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketing_qa
          POSTGRES_PASSWORD: local_marketing_qa_only
          POSTGRES_DB: marketing_mvp_local
        ports: ['55498:5432']
        options: >-
          --health-cmd "pg_isready -U marketing_qa -d marketing_mvp_local"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MARKETING_DATABASE_URL: postgresql://marketing_qa:local_marketing_qa_only@127.0.0.1:55498/marketing_mvp_local
      MARKETING_TEST_DATABASE_URL: postgresql://marketing_qa:local_marketing_qa_only@127.0.0.1:55498/marketing_mvp_local
      MARKETING_AUTH_SECRET: synthetic-ci-only-auth-secret-at-least-32-characters
      MARKETING_AI_ENABLED: 'false'
      MARKETING_DEMO_MODE: 'true'
      MARKETING_FULL_JOURNEY: 'true'
      MARKETING_BROWSER_CHANNEL: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run marketing:db:migrate
      - run: npm run marketing:db:migrate
      - run: npm run test:run -- src/lib/marketing/websiteIntake apps/marketing-saas-api/src/pack.provider.test.ts
      - run: npm run marketing:test:integration
      - run: npm run marketing:db:verify
      - run: npm --prefix apps/marketing-saas-api run typecheck
      - run: npm --prefix apps/marketing-saas run typecheck
      - run: npm --prefix apps/marketing-saas run build
      - run: npx playwright install --with-deps chromium
      - name: Complete synthetic browser journey
        run: |
          npm run marketing:demo > /tmp/marketing-saas-demo.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3108/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/marketing-saas-pilot-smoke.mjs
          node scripts/marketing-saas-landing-smoke.mjs
          MARKETING_BRAND_ORIGIN=http://127.0.0.1:3108 node scripts/marketing-saas-brand-smoke.mjs
      - run: npm run marketing:db:verify
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marketing-saas-synthetic-browser-evidence
          path: |
            docs/qa/marketing-saas/screenshots/complete-journey-*.png
            docs/qa/marketing-saas/synthetic-pack.md
            docs/qa/marketing-saas/ux-410/**
            docs/qa/marketing-saas/ux-411-refinement/**
            docs/design/marketing-saas/brand-01/qa/**
