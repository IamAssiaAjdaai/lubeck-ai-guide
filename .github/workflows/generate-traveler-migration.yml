name: Generate Traveler Account Migration

on:
  push:
    branches:
      - feat/user-accounts

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Commit generated Drizzle files
        shell: bash
        run: |
          if git diff --quiet -- drizzle; then
            echo "No Drizzle changes generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "chore: generate traveler account migration"
          git push origin HEAD:feat/user-accounts
